<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Abrir SMS · MCS</title>
  <style>
    :root{--bg:#F7F4EE;--fg:#1B1A17;--muted:#6B655B;--line:#E2DCCF;--btn:#3A6EA5;--btn-fg:#FFFFFF;--sunk:#EFEAE0}
    @media (prefers-color-scheme: dark){:root{--bg:#141412;--fg:#F2EEE6;--muted:#A49D90;--line:#2E2C28;--btn:#7FB0E6;--btn-fg:#10161D;--sunk:#1E1D1A}}
    body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,sans-serif}
    main{max-width:520px;margin:0 auto;padding:28px 16px;display:grid;gap:14px}
    h1{font-size:20px;margin:0}
    p{margin:0;color:var(--muted)}
    .msg{white-space:pre-wrap;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 13px;overflow-wrap:anywhere}
    a.go,button{display:block;text-align:center;border-radius:12px;padding:16px;font:700 18px/1.2 system-ui,-apple-system,sans-serif;text-decoration:none;cursor:pointer}
    a.go{background:var(--btn);color:var(--btn-fg)}
    button{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:600;font-size:15px;padding:12px}
  </style>
</head>
<body>
<main>
  <h1 id="to">SMS</h1>
  <div class="msg" id="body"></div>
  <a class="go" id="go" href="#">Abrir no Mensagens</a>
  <button type="button" id="copy">Copiar mensagem</button>
  <p>Depois de enviar, volte para a Central e toque na próxima parte.</p>
</main>
<script>
  // Ponte para o SMS: a Central roda dentro de uma página que não abre o app de Mensagens.
  // O número e o texto vêm depois do # e nunca chegam ao servidor.
  (function () {
    var params = new URLSearchParams(location.hash.slice(1));
    var to = String(params.get('to') || '').replace(/[^\d+]/g, '');
    var body = String(params.get('body') || '');
    var link = 'sms:' + to + '?&body=' + encodeURIComponent(body);
    document.getElementById('to').textContent = to ? 'SMS para ' + to : 'Número ausente';
    document.getElementById('body').textContent = body;
    var go = document.getElementById('go');
    go.href = link;
    document.getElementById('copy').addEventListener('click', function () {
      try { navigator.clipboard.writeText(body); this.textContent = 'Copiada'; } catch (e) {}
    });
    if (to) { try { location.href = link; } catch (e) {} }
  })();
</script>
</body>
</html>
